<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acx | @acxiscoolerthanyou</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #070707;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #161616 0%, #000000 100%);
        }

        .card {
            background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 45px 60px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            animation: fadeIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar-wrapper {
            margin-bottom: 24px;
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2a2a2a;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s ease, border-color 0.4s ease;
        }

        .avatar:hover {
            transform: scale(1.06);
            border-color: #4a4a4a;
        }

        .display-name {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
        }

        .username {
            font-size: 16px;
            color: #7a7a7a;
            font-weight: 400;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .badge {
            background: #111;
            border: 1px solid #222;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .badge:hover {
            background: #1a1a1a;
            color: #fff;
            border-color: #444;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar-wrapper">
            <img src="8eejeSevJl4nZK6.jpg" alt="Profile Picture" class="avatar">
        </div>
        
        <h1 class="display-name">Acx</h1>
        <p class="username">@acxiscoolerthanyou</p>
        
        <div class="badges">
            <div class="badge">github</div>
            <div class="badge">unknown</div>
        </div>
    </div>
</body>
</html>
